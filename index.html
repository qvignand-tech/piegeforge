<html lang="fr">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060f;--panel:#141024;--panel2:#1d1733;--line:#2e2550;--gold:#ffcf5a;--teal:#3fe0c5;--red:#ff4d6d;--txt:#e9e4ff;--mut:#9a90c4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:radial-gradient(ellipse at top,#1a1238 0%,var(--bg) 60%);color:var(--txt);font-family:Inter,system-ui,sans-serif;min-height:100%;user-select:none;-webkit-user-select:none}
#app{max-width:1280px;margin:0 auto;padding:10px}
#top{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
#logo{font-family:Cinzel,serif;font-weight:900;font-size:22px;letter-spacing:2px;background:linear-gradient(100deg,#ffb347 0%,#ff9f43 30%,#fff6d8 50%,#ff9f43 70%,#e8590c 100%);background-size:220% 100%;animation:shine 7s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 6px rgba(255,140,40,.35))}
#mapName{margin-right:auto;color:var(--mut);font-weight:600;font-size:14px}
.stat{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:10px;font-weight:800;font-size:15px}
.stat svg{width:18px;height:18px}
.btn{font-family:Inter;font-weight:800;font-size:14px;color:var(--txt);background:linear-gradient(180deg,#2c2350,#1c1636);border:1px solid #43387a;padding:8px 14px;border-radius:10px;cursor:pointer;transition:.12s;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-1px);border-color:#7a6cd0;box-shadow:0 4px 14px rgba(120,100,255,.25)}
.btn:disabled{opacity:.4;cursor:default}
.btn.go{background:linear-gradient(180deg,#ff9f43,#d9480f);border-color:#ffb86b;color:#fff;font-size:16px;padding:10px 20px;box-shadow:0 4px 18px rgba(255,120,40,.35)}
.btn.sm{font-size:12.5px;padding:6px 10px}
#stage{position:relative;width:100%;aspect-ratio:2/1;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.6)}
canvas{display:block;width:100%;height:100%;cursor:pointer}
#bottom{display:flex;gap:10px;margin-top:8px;align-items:stretch;flex-wrap:wrap}
#shop{display:flex;gap:8px;flex:1;min-width:300px;flex-wrap:wrap}
.card{position:relative;width:118px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:6px 6px 8px;cursor:pointer;text-align:center;transition:transform .16s cubic-bezier(.2,.9,.3,1.5),box-shadow .16s,border-color .16s,opacity .12s}
.card:not(.dis):not(.empty):hover{transform:translateY(-6px) scale(1.04);box-shadow:0 12px 26px rgba(0,0,0,.5)}
.card:not(.dis):not(.empty):active{transform:translateY(-1px) scale(.97);transition-duration:.05s}
#bStart:not(:disabled){animation:pulseGo 2.6s ease-in-out infinite}
@keyframes pulseGo{0%,100%{box-shadow:0 6px 18px rgba(255,140,40,.22)}50%{box-shadow:0 8px 28px rgba(255,160,60,.5)}}
.goldPop{position:fixed;z-index:60;pointer-events:none;font:900 15px Inter,sans-serif;color:#ffcf5a;text-shadow:0 2px 6px rgba(0,0,0,.8);animation:gpop .9s ease-out forwards}
@keyframes gpop{0%{opacity:0;transform:translateY(4px) scale(.8)}18%{opacity:1;transform:translateY(-4px) scale(1.1)}100%{opacity:0;transform:translateY(-26px) scale(1)}}
.card:hover:not(.dis){transform:translateY(-3px);border-color:#7a6cd0}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,207,90,.35),0 6px 20px rgba(255,180,60,.25)}
.card.dis{opacity:.38;cursor:default}
.card.hid{border-color:#5b4aa8}
.card .tag{position:absolute;top:4px;right:4px;font-size:9px;font-weight:800;background:#3a2c7a;color:#cfc6ff;padding:1px 5px;border-radius:6px}
.card canvas{width:56px;height:56px!important;margin:0 auto 2px;cursor:inherit}
.card .n{font-weight:800;font-size:13px}
.card .p{font-weight:800;font-size:13px;color:var(--gold)}
.card .d{font-size:10.5px;color:var(--mut);line-height:1.25;margin-top:2px;min-height:26px}
.card.empty{opacity:.18;cursor:default;border-style:dashed}
#actions{display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:170px}
#hint{margin-top:6px;font-size:13px;color:var(--mut);min-height:18px;text-align:center}
#relics{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;justify-content:center}
.relic{font-size:11.5px;background:var(--panel);border:1px solid var(--line);padding:3px 8px;border-radius:20px;color:#cfc6ff}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,4,14,.74);backdrop-filter:blur(3px);z-index:5;overflow:auto}
#overlay.hide,#pop.hide{display:none}
.panel{background:linear-gradient(180deg,#1d1638,#120e24);border:1px solid #43387a;border-radius:18px;padding:22px 28px;text-align:center;max-width:760px;box-shadow:0 30px 80px rgba(0,0,0,.6);margin:10px}
.panel h1{font-family:Cinzel,serif;font-weight:900;font-size:clamp(28px,5vw,52px);letter-spacing:4px;background:linear-gradient(180deg,#fff2c4,#ffb347 55%,#e8590c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(255,140,40,.4))}
.panel h2{font-family:Cinzel,serif;font-size:26px;color:var(--gold);margin-bottom:6px}
.panel p{color:#cfc8f0;margin:8px 0;line-height:1.5;font-size:14.5px}
.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.choice{width:170px;background:linear-gradient(180deg,#2a2150,#17122d);border:1px solid #4a3e88;border-radius:14px;padding:12px;cursor:pointer;transition:.15s}
.choice:hover,.choice.sel{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 10px 30px rgba(255,190,80,.2)}
.choice .ic{font-size:30px}
.choice b{display:block;margin:6px 0;color:var(--gold);font-size:15px}
.choice span{font-size:12px;color:#c4bce8;line-height:1.35;display:block}
.choice canvas{width:100%;height:auto;aspect-ratio:2/1;border-radius:8px;margin-bottom:4px;border:1px solid #2e2550}
#pop{position:absolute;z-index:4;transform:translate(-50%,calc(-100% - 8px));background:linear-gradient(180deg,#221a40,#151029);border:1px solid #5b4aa8;border-radius:12px;padding:8px 10px;min-width:170px;box-shadow:0 12px 30px rgba(0,0,0,.6);text-align:center}
#pop .t{font-weight:800;font-size:14px}#pop .s{font-size:11.5px;color:var(--mut);margin:2px 0 6px}
#pop .row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
#maps .choice{width:158px;padding:8px}#maps .choice span{font-size:11px}#maps .choice b{margin:3px 0}.panel{max-width:820px}
.btn.on{border-color:var(--gold);color:var(--gold);background:linear-gradient(180deg,#5a3d1a,#3a260d)}
.stat.full{border-color:#ff9f43}.stat.full span{color:#ff9f43}
@keyframes shine{from{background-position:120% 0}to{background-position:-100% 0}}
@keyframes deal{from{opacity:0;transform:translateY(24px) scale(.85) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes panelIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes goPulse{0%,100%{box-shadow:0 4px 18px rgba(255,120,40,.35)}50%{box-shadow:0 4px 32px rgba(255,160,70,.75)}}
#shop.deal .card{animation:deal .38s cubic-bezier(.2,.9,.3,1.3) backwards}
#shop.deal .card:nth-child(2){animation-delay:.06s}#shop.deal .card:nth-child(3){animation-delay:.12s}#shop.deal .card:nth-child(4){animation-delay:.18s}#shop.deal .card:nth-child(5){animation-delay:.24s}#shop.deal .card:nth-child(6){animation-delay:.3s}
.panel{animation:panelIn .35s cubic-bezier(.2,.9,.3,1.15)}
.stat{transition:transform .12s,border-color .2s,box-shadow .2s}
.stat.bump{transform:scale(1.12);border-color:var(--gold);box-shadow:0 0 14px rgba(255,207,90,.4)}
.stat.hurt{transform:scale(1.12);border-color:var(--red);box-shadow:0 0 18px rgba(255,77,109,.65)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.97)}
.btn.go:not(:disabled){animation:goPulse 2.2s ease-in-out infinite}
.card.t2{border-color:#3a4f8f}.card.t3{border-color:#8a6a2a}
.card.t3 .n{color:#ffe6a8}
@media (prefers-reduced-motion:reduce){#logo,.btn.go,.panel,#shop.deal .card,#bStart:not(:disabled),.goldPop{animation:none!important}.card:hover{transform:none!important}}
@media (max-width:700px){.card{width:96px}.card .d{display:none}#logo{font-size:17px}}
.btn:active{transform:scale(.94)}.card:active{transform:scale(.95)}
#bench{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:136px;z-index:3;background:linear-gradient(180deg,#2e2216,#1a130d);border:2px solid #7a5a32;border-radius:12px;padding:8px;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.6)}
#bench.hide{display:none}
#bench .bt{font-weight:800;font-size:13px;color:#ffcf5a;margin-bottom:6px}
#bench .bslot{height:60px;border:2px dashed #7a5a32;border-radius:9px;background:rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;color:#c9b08a;cursor:pointer;line-height:1.15}
#bench .bslot.full{border-style:solid;border-color:#ffcf5a;color:#e9e4ff}
#bench .bslot canvas,#bench .bres canvas{width:38px;height:38px!important;margin:0 auto}
#bench .bplus{font-weight:800;color:#c9b08a;line-height:16px}
#bench .bres{font-size:10.5px;color:#e9e4ff;min-height:98px;margin:2px 0 6px;display:flex;flex-direction:column;justify-content:center;line-height:1.2}
#bench .bres b{font-size:12.5px;margin-bottom:2px}
#bench .brow{display:flex;align-items:center;gap:2px}
#bench .brow .bslot{flex:1;height:52px;font-size:9.5px}
#bench .bgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:4px}
#bench .bgrid canvas{width:22px;height:22px!important;margin:0 auto;opacity:.5;border-radius:50%}
#bench .bgrid canvas.kn,#bench .bgrid canvas:hover{opacity:1}
#bench .bgrid canvas:hover{outline:2px solid #ffcf5a}
#bench{max-height:97%;overflow:auto}
#bench .bh{font-size:9.5px;color:#a8977a;margin-top:6px;line-height:1.25}
#bench .btn{width:100%}
.btn.on{border-color:#ffcf5a;color:#ffcf5a}
#mobAct,#rot{display:none}
#instOv{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(4,2,10,.78);opacity:0;transition:opacity .3s;padding:14px;box-sizing:border-box}
#instOv.in{opacity:1}
#instOv .instB{background:linear-gradient(180deg,#1e1740,#140f2c);border:1px solid #5b4aa8;border-radius:18px;padding:20px 24px;max-width:430px;text-align:center;box-shadow:0 22px 60px rgba(0,0,0,.7);transform:translateY(16px) scale(.96);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#instOv.in .instB{transform:none}
#instOv img{width:76px;height:76px;border-radius:18px;display:block;margin:0 auto 10px;box-shadow:0 8px 24px rgba(255,77,109,.3)}
#instOv h3{font-family:Cinzel,serif;font-size:23px;margin:0 0 6px;color:#ffcf5a}
#instOv p{font-size:13.5px;color:#cfc8f0;margin:0 0 14px;line-height:1.5}
#instOv .instR{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
#instOv small{display:block;margin-top:10px;font-size:11px;color:#6f679a}
body.mob #instOv .instB{padding:12px 18px;max-width:390px}body.mob #instOv img{width:52px;height:52px;margin-bottom:6px}body.mob #instOv h3{font-size:19px}body.mob #instOv p{font-size:12px;margin-bottom:10px}
#upT{position:fixed;left:50%;bottom:16px;transform:translate(-50%,24px);opacity:0;transition:all .35s cubic-bezier(.2,.8,.2,1);z-index:200;display:flex;align-items:center;gap:12px;background:rgba(14,10,28,.96);border:1px solid #5b4aa8;border-radius:13px;padding:10px 14px;box-shadow:0 14px 34px rgba(0,0,0,.65);font:700 13.5px Inter,sans-serif;color:#e9e4ff;max-width:min(92vw,520px)}
#upT.in{opacity:1;transform:translate(-50%,0)}
#upT button{background:linear-gradient(180deg,#ff9f43,#e8590c);border:none;border-radius:9px;color:#1a0f00;font:800 13px Inter,sans-serif;padding:7px 13px;cursor:pointer;white-space:nowrap}
#cineBar{display:none;position:absolute;left:50%;top:7px;transform:translateX(-50%);z-index:4;gap:6px;align-items:center}
body.cine #cineBar{display:flex}
#cineBar span{font-size:17px;line-height:1;padding:6px 10px;border-radius:11px;background:rgba(14,10,28,.86);border:1px solid #3a3066;opacity:.42;filter:grayscale(.7);transition:all .3s;white-space:nowrap}
#cineBar span.on{opacity:1;filter:none;border-color:#ffcf5a;transform:scale(1.18);box-shadow:0 0 16px rgba(255,207,90,.5)}
#cineSkip{margin-left:10px;font-size:17px;line-height:1;padding:6px 12px;border-radius:11px;background:rgba(14,10,28,.86);border:1px solid #5b4aa8;color:#fff;cursor:pointer}
body.cine #top,body.cine #bottom,body.cine #hint{visibility:hidden}body.cine #cv{cursor:default}
body.mob #cineBar span{font-size:13px;padding:4px 7px}body.mob #cineSkip{font-size:14px;padding:4px 10px}
body.md #bReroll,body.md #bBench,body.md #stSlots,body.md #bBookT{display:none}body.mob.md.wv #mPow{display:none}body.mob.md.wv #shop{display:grid}
.card.hc{width:92px;padding:5px 4px}.card.hc canvas{width:48px;height:48px}.card.hc .n{font-size:11.5px}body:not(.mob) #shop:has(.hc){flex-wrap:wrap;justify-content:center;max-width:1100px}
.pzc{width:150px;padding:8px}.pzc.done{border-color:#2b7a6c}.pzc span{font-size:11.5px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;max-width:min(92vw,520px);background:rgba(8,6,16,.96);border:1px solid #5b4aa8;border-radius:12px;padding:10px 16px;font-weight:700;font-size:13.5px;line-height:1.4;text-align:center;color:#ffe08a;box-shadow:0 12px 30px rgba(0,0,0,.6);pointer-events:none}
body.mob.port #toast{left:14px;bottom:50%;transform:translateY(50%) rotate(90deg);transform-origin:left center;max-width:80vh}
html{background:#07060f}
html:has(body.mob){overflow:hidden;height:100%}
body.mob #overlay,body.mob #bench,body.mob #pop,body.mob #shop{-webkit-overflow-scrolling:touch}
body.mob{overflow:hidden;touch-action:manipulation;overscroll-behavior:none;margin:0;position:fixed;inset:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body.mob #app{position:fixed;left:0;top:0;width:var(--vw,100vw);height:var(--vh,100vh);max-width:none;margin:0;box-sizing:border-box;padding:4px max(4px,env(safe-area-inset-right)) 4px max(4px,env(safe-area-inset-left));display:grid;grid-template-columns:calc(var(--sh)*2) minmax(0,1fr);grid-template-rows:36px var(--sh);gap:4px;align-content:center}
body.mob.port #app{transform-origin:0 0;transform:rotate(90deg) translateY(-100%);padding:4px max(4px,env(safe-area-inset-bottom)) 4px max(4px,env(safe-area-inset-top))}
body.mob #top{grid-column:1/3;margin:0;gap:4px;flex-wrap:nowrap;height:36px;align-items:center;position:relative;min-width:0}

body.mob #stage{grid-column:1;grid-row:2;height:var(--sh);width:calc(var(--sh)*2);aspect-ratio:auto;border-radius:10px;box-sizing:border-box}
